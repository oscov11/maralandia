<style>
/* VOICE: tierno, juguet&#243;n, sin texto: todo se entiende tocando
   IDEA: una casita de mu&#241;ecas de cart&#243;n pintado que se abre en tres sitios
   PICTURE: la escena entera es el juego, a pantalla completa
   COLOUR and TYPE: pasteles vivos con contorno marr&#243;n c&#225;lido; letra redondeada
   LAYOUT: escenario 16:9 escalado, botones gordos en las esquinas */
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
.layer{position:absolute;inset:0}
#bg svg,#map svg{width:100%;height:100%;display:block}
#objs{pointer-events:none}
.obj{left:0;top:0;position:absolute;pointer-events:none;touch-action:none}
.obj svg *{pointer-events:visiblePainted}
.obj svg{width:100%;height:100%;display:block;overflow:visible}
.in{position:relative;width:100%;height:100%;transform-origin:50% 100%;transition:transform .15s}
.obj.lifted{will-change:transform}
.obj.lifted>.in{transform:scale(1.1)}
.jmp>.in{animation:jmp .55s ease-out}
.wig>.in{animation:wig .45s ease-in-out}
.squash>.in{animation:squash .3s ease-out}
@keyframes jmp{0%{transform:translateY(0) scale(1.1,.9)}35%{transform:translateY(-70px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes squash{0%{transform:scale(1.25,.75)}60%{transform:scale(.92,1.08)}100%{transform:none}}
.eyes{animation:blink 4.2s infinite;transform-origin:70px 74px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.swingseat{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 22px}
.swinging{animation:swg 2.4s ease-in-out infinite}
@keyframes swg{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.flame{animation:flk .5s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes flk{from{transform:scale(1,.9)}to{transform:scale(.92,1.1)}}
.twk circle.lt{animation:twk .7s steps(2) infinite}
.twk circle.lt:nth-child(odd){animation-delay:.35s}
@keyframes twk{0%{opacity:1}100%{opacity:.25}}
.part{position:absolute;width:46px;height:46px;pointer-events:none;z-index:450000;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
.gone{transition:transform .25s,opacity .25s;transform:scale(.1);opacity:0}
#snow{position:absolute;inset:0;pointer-events:none;z-index:150000}
/* UI */
#ui{position:absolute;inset:0;pointer-events:none;z-index:300000}
.btn{position:absolute;pointer-events:auto;width:120px;height:120px;border-radius:50%;border:6px solid #fff;box-shadow:0 8px 0 rgba(60,40,30,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.9)}
.btn svg{width:66%;height:66%}
#bHome{left:28px;top:24px;background:#ff9f43}
#bMirror{left:170px;top:24px;background:#c77dff}
#bBox{left:28px;bottom:24px;width:150px;height:150px;background:#2fbf71}
#bPocket{right:28px;top:24px;background:#4fb3ff}
#bTrash{right:28px;bottom:24px;background:#9aa5b1}
#bTrash.hot,#bPocket.hot{transform:scale(1.25)}
.badge{position:absolute;right:-6px;top:-6px;min-width:44px;height:44px;border-radius:22px;background:#ff4d6d;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
#tray{position:absolute;left:0;right:0;bottom:0;height:330px;background:#fff7ea;border-top:8px solid #ffd27a;border-radius:46px 46px 0 0;pointer-events:auto;transform:translateY(110%);transition:transform .3s cubic-bezier(.3,1.4,.6,1);box-shadow:0 -10px 0 rgba(60,40,30,.12)}
#tray.open{transform:none}
#tabs{display:flex;gap:18px;padding:18px 30px 6px 200px}
.tab{width:110px;height:84px;border-radius:26px;background:#ffe7bf;display:flex;align-items:center;justify-content:center;border:5px solid transparent}
.tab.on{background:#fff;border-color:#ffb347}
.tab svg{width:64px;height:64px}
#items{display:flex;gap:22px;padding:14px 30px 20px;overflow-x:auto;touch-action:pan-x;height:190px;align-items:center}
.it{flex:none;width:150px;height:150px;border-radius:32px;background:#fff;box-shadow:0 6px 0 #f1dcc0;display:flex;align-items:center;justify-content:center;touch-action:pan-x}
.it svg{max-width:120px;max-height:120px;overflow:visible}
#trayClose{position:absolute;right:30px;top:18px;width:90px;height:90px;border-radius:50%;background:#ff6b6b;border:5px solid #fff;display:flex;align-items:center;justify-content:center}
#creator{background:#fde7f1!important}
#creator,#modal{position:absolute;inset:0;background:rgba(255,240,220,.96);pointer-events:auto;display:none;z-index:400000}
#creator.open,#modal.open{display:block}
#prev{position:absolute;left:70px;top:90px;width:430px;height:720px;border-radius:50px;background:#fff;box-shadow:0 10px 0 #f1dcc0}
#prev svg{position:absolute;left:55px;top:60px;width:320px;height:600px;overflow:visible}
.arrow{position:absolute;top:400px;width:90px;height:90px;border-radius:50%;background:#ffb347;border:5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(60,40,30,.2)}
#rows{position:absolute;left:560px;top:30px;right:210px;bottom:20px}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center;height:96px}
.row .ic{width:86px;height:86px;flex:none;display:flex;align-items:center;justify-content:center}
.sw{width:72px;height:72px;border-radius:50%;border:6px solid #fff;box-shadow:0 5px 0 rgba(60,40,30,.2);flex:none;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.sw.on{border-color:#4a3b36;transform:scale(1.1)}
.sw svg{width:90%;height:90%;overflow:visible}
.big{position:absolute;width:140px;height:140px;border-radius:50%;border:7px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(60,40,30,.25)}
.big svg{width:60%;height:60%}
#ok{right:50px;bottom:40px;background:#2fbf71}
#add{right:50px;bottom:200px;background:#ffb347}
#rot{position:fixed;inset:0;background:#8fd3ff;display:none;align-items:center;justify-content:center;z-index:9}
#rot svg{width:40vw;animation:rt 2s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
.loc{cursor:pointer}
.loc:nth-of-type(2){animation-delay:-.9s}.loc:nth-of-type(3){animation-delay:-1.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#reset{position:absolute;left:30px;top:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#reset svg{width:50px}
#reset .ring{position:absolute;inset:-6px;border-radius:50%;border:8px solid #ff6b6b;clip-path:inset(0 0 0 0);opacity:0}
#modal .box{position:absolute;left:calc(50% - 350px);top:220px;width:700px;height:420px;background:#fff;border-radius:50px;text-align:center;font-size:54px;color:#4a3b36;padding-top:60px;box-sizing:border-box}
#light{position:absolute;inset:0;pointer-events:none;z-index:140000;overflow:visible}
#light .vig{left:-320px;right:-320px}
#stage{width:1600px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(90,45,20,.28));}
.vig.warm{background:radial-gradient(ellipse 80% 75% at 60% 40%,transparent 55%,rgba(40,80,20,.22))}
.vig.cool{background:radial-gradient(ellipse 80% 75% at 50% 40%,transparent 55%,rgba(40,70,130,.22))}
.beam{position:absolute;inset:0;background:linear-gradient(170deg,rgba(255,248,210,.55),rgba(255,248,210,0) 70%);clip-path:polygon(600px 130px,940px 130px,1180px 900px,560px 900px);opacity:.6}
@keyframes beam{from{opacity:.7}to{opacity:1}}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.glow.fire{background:radial-gradient(circle,rgba(255,170,60,.55),rgba(255,140,40,0) 65%);animation:fireg 1.3s ease-in-out infinite alternate}
@keyframes fireg{0%{opacity:.6;transform:scale(.95)}50%{opacity:.9}100%{opacity:.7;transform:scale(1.05)}}
.glow.sun{background:radial-gradient(circle,rgba(255,240,170,.6),rgba(255,240,170,0) 65%)}
.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff8d0;opacity:0;animation:mote 8s linear infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.8}80%{opacity:.6}100%{opacity:0;transform:translate(40px,-120px)}}
.spark{position:absolute;width:14px;height:14px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spk 3s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.bfly{position:absolute;width:44px;height:34px;animation:bfly 9s ease-in-out infinite}

function musGain(){const a=ac();if(!a)return null;if(!mus.gain){mus.gain=a.createGain();mus.gain.gain.value=.55;mus.gain.connect(a.destination)}return mus.gain}
function playNote(f,t,d,bell){const a=ac(),g0=musGain();if(!a||!g0)return;const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
 const g2=a.createGain();g2.gain.value=bell?.35:.18;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(g0);
 const v=.075;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(v*.35,t+Math.min(.25,d*.5));g.gain.exponentialRampToValueAtTime(.0008,t+d*.95+.05);
 o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function jingleTick(t){const a=ac(),g0=musGain();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.06,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=6000;g.gain.value=.05;s.buffer=b;s.connect(f);f.connect(g);g.connect(g0);s.start(t)}
function musTick(){const a=ac();if(!a||!mus.on)return;if(W&&W.mute){mus.t=a.currentTime+.1;return}
 while(mus.t<a.currentTime+.6){const song=SONGS[mus.list[mus.li]];const beat=60/song.bpm;const [n,d]=song.m[mus.ni];
  if(n!=='R')playNote(NOTEF(n),mus.t,d*beat,song.bell);if(song.bell&&mus.ni%2===0)jingleTick(mus.t);
  mus.t+=d*beat;mus.ni++;if(mus.ni>=song.m.length){mus.ni=0;mus.li=(mus.li+1)%mus.list.length;mus.t+=beat*2}}}

const LCOLS=['#ff5a5a','#ff9f43','#ffd23f','#6fd86f','#4fa3ff','#a06cff','#ff8fc8'];
const LMODES=['\u00a1Luces de colores!','\u00a1Arco\u00edris que corre!','\u00a1Luces tranquilas!'];
function bulbs(path,n,m,seed){let s='';for(let i=0;i<n;i++){const t=i/(n-1),[x,y]=path(t),c=LCOLS[(i+seed)%LCOLS.length],d=((i*0.37)%1.4).toFixed(2);

const sag=(x0,x1,y,dip)=>t=>[x0+(x1-x0)*t,y+Math.sin(t*Math.PI)*dip];
